
id: supabase-edge-function-get-with-body
language: TypeScript
files:
  - src/**/*.ts
  - src/**/*.tsx

severity: warning

message: |
  Avoid sending a request body with a GET request to a Supabase Edge Function.

  Put the parameters in the URL query string instead:

  supabase.functions.invoke(
    `function-name?task_id=${taskId}&action=check`,
    { method: "GET" }
  )

  GET request bodies do not have generally defined semantics.
  Use a query string for GET parameters.

rule:
  any:
    - pattern: 'supabase.functions.invoke($FUNC, { method: "GET", body: $BODY })'
    - pattern: "supabase.functions.invoke($FUNC, { method: 'GET', body: $BODY })"
    - pattern: 'supabase.functions.invoke($FUNC, { body: $BODY, method: "GET" })'
    - pattern: "supabase.functions.invoke($FUNC, { body: $BODY, method: 'GET' })"
    - pattern: 'supabase.functions.invoke<$TYPE>($FUNC, { method: "GET", body: $BODY })'
    - pattern: "supabase.functions.invoke<$TYPE>($FUNC, { method: 'GET', body: $BODY })"
    - pattern: 'supabase.functions.invoke<$TYPE>($FUNC, { body: $BODY, method: "GET" })'
    - pattern: "supabase.functions.invoke<$TYPE>($FUNC, { body: $BODY, method: 'GET' })"
