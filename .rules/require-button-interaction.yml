
id: require-button-interaction
language: tsx
files:
  - src/**/*.tsx
  - src/**/*.jsx

rule:
  kind: jsx_opening_element
  all:
    # Match Button components
    - has:
        field: name
        regex: "^Button$"

    # Ignore buttons with an explicit click handler
    - not:
        has:
          kind: jsx_attribute
          has:
            field: name
            regex: "^onClick$"

    # Ignore native form submission and reset buttons
    - not:
        has:
          kind: jsx_attribute
          all:
            - has:
                field: name
                regex: "^type$"
            - has:
                kind: string
                regex: '^"(submit|reset)"$'

    # Ignore buttons nested inside recognized Radix-style triggers
    - not:
        inside:
          stopBy: end
          kind: jsx_element
          has:
            field: name
            regex: "^[A-Za-z]+Trigger$"

message: "This Button has no explicit click handler or native form action. Add an onClick handler, use type='submit' or type='reset' when appropriate, or verify that its parent component provides the interaction."

severity: warning
