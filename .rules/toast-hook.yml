
id: use-toast-import
language: Tsx

message: |
  The legacy use-toast hook was detected.

  Review its toast calls before migrating to Sonner.

  Replace the import with:
  import { toast } from "sonner";

  Update the toast calls to match Sonner's API.
  Do not replace the import alone if the existing call signatures differ.

severity: warning

rule:
  pattern: |
    import { $$$IMPORTS } from "@/hooks/use-toast"
