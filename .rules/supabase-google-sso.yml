
id: supabase-google-oauth-review
language: Tsx
files:
  - src/**/*.tsx
  - src/**/*.ts

rule:
  pattern: |
    $AUTH.signInWithOAuth({ $$$ })

message: |
  Supabase OAuth integration detected.

  Review this authentication configuration to ensure it
  belongs to this project and is intentionally configured.

  Use the standard Supabase OAuth flow only when the project
  explicitly requires an external OAuth provider.

  Do not replace signInWithOAuth with Miaoda-specific SSO
  integrations or hardcoded third-party domains.

  Keep authentication configuration independent of
  platform-specific integrations.

severity: warning
