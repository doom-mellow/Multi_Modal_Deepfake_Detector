
id: button-default-low-contrast
language: tsx
files:
  - src/**/*.tsx
message: "Potential contrast issue: a default Button uses text-primary instead of text-primary-foreground. The default variant has a primary background. Use text-primary-foreground or remove the custom text colour."
rule:
  kind: jsx_element
  has:
    kind: jsx_opening_element
    all:
      - has:
          field: name
          regex: "^Button$"
      - has:
          kind: jsx_attribute
          all:
            - has:
                kind: property_identifier
                regex: "^className$"
            - has:
                kind: string
                has:
                  kind: string_fragment
                  regex: "(^|\\s)text-primary(\\s|$)"
      - not:
          has:
            kind: jsx_attribute
            has:
              kind: property_identifier
              regex: "^variant$"
---
id: button-outline-background-text-conflict
language: tsx
files:
  - src/**/*.tsx
message: "Potential contrast issue: an outline Button uses text-background, which may blend into its background. Use text-foreground or the default semantic foreground colour."
rule:
  kind: jsx_element
  has:
    kind: jsx_opening_element
    all:
      - has:
          field: name
          regex: "^Button$"
      - has:
          kind: jsx_attribute
          all:
            - has:
                kind: property_identifier
                regex: "^variant$"
            - has:
                kind: string
                has:
                  kind: string_fragment
                  regex: "^outline$"
      - has:
          kind: jsx_attribute
          all:
            - has:
                kind: property_identifier
                regex: "^className$"
            - has:
                kind: string
                has:
                  kind: string_fragment
                  regex: "(^|\\s)text-background(\\s|$)"
---
id: button-outline-light-text
language: tsx
files:
  - src/**/*.tsx
message: "Potential contrast issue: an outline Button uses a light text colour. Check its actual background in both light and dark themes. Prefer text-foreground unless a contrasting background is explicitly provided."
rule:
  kind: jsx_element
  has:
    kind: jsx_opening_element
    all:
      - has:
          field: name
          regex: "^Button$"
      - has:
          kind: jsx_attribute
          all:
            - has:
                kind: property_identifier
                regex: "^variant$"
            - has:
                kind: string
                has:
                  kind: string_fragment
                  regex: "^outline$"
      - has:
          kind: jsx_attribute
          all:
            - has:
                kind: property_identifier
                regex: "^className$"
            - has:
                kind: string
                has:
                  kind: string_fragment
                  regex: "(^|\\s)text-(white|gray-[0-9]+)(\\s|$)"
---
id: button-destructive-text-primary
language: tsx
files:
  - src/**/*.tsx
message: "Potential contrast issue: a destructive Button uses text-primary, which may not contrast with its destructive background. Prefer text-destructive-foreground."
rule:
  kind: jsx_element
  has:
    kind: jsx_opening_element
    all:
      - has:
          field: name
          regex: "^Button$"
      - has:
          kind: jsx_attribute
          all:
            - has:
                kind: property_identifier
                regex: "^variant$"
            - has:
                kind: string
                has:
                  kind: string_fragment
                  regex: "^destructive$"
      - has:
          kind: jsx_attribute
          all:
            - has:
                kind: property_identifier
                regex: "^className$"
            - has:
                kind: string
                has:
                  kind: string_fragment
                  regex: "(^|\\s)text-primary(\\s|$)"
