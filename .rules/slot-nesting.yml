
id: radix-trigger-formcontrol-nesting
language: Tsx
files:
  - src/**/*.tsx

message: |
  A Radix Trigger using asChild contains a FormControl.

  Avoid using FormControl as the trigger's child.
  Use the interactive element directly:

  <PopoverTrigger asChild>
    <Button>Open</Button>
  </PopoverTrigger>

  FormControl is intended for form controls. Review nested Slot
  composition to avoid unexpected ref or event-handler behaviour.

severity: warning

rule:
  kind: jsx_element
  all:
    - has:
        kind: jsx_opening_element
        all:
          - has:
              field: name
              regex: "^(Popover|Dialog|DropdownMenu|AlertDialog|HoverCard|Menubar|NavigationMenu|ContextMenu|Tooltip)Trigger$"
          - has:
              kind: jsx_attribute
              has:
                field: name
                regex: "^asChild$"
    - has:
        kind: jsx_element
        has:
          kind: jsx_opening_element
          has:
            field: name
            regex: "^FormControl$"
