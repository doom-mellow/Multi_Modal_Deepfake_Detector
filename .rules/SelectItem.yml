
id: selectItemWithEmptyValue
language: Tsx
files:
  - src/**/*.tsx

rule:
  kind: jsx_opening_element
  all:
    - has:
        field: name
        regex: '^SelectItem$'
    - has:
        kind: jsx_attribute
        all:
          - has:
              field: name
              regex: '^value$'
          - any:
              - has:
                  kind: string
                  regex: '^""$'
              - has:
                  kind: jsx_expression
                  has:
                    kind: string
                    regex: '^""$'

message: 'SelectItem must not use an empty string as its value. Use a meaningful non-empty value, such as "all" when the application explicitly handles it as a special option.'

severity: error
