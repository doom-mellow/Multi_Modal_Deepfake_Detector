[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-origin-detector"
version = "0.1.0"
description = "A language-aware baseline classifier for AI-like versus human-like code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
code-origin = "code_origin_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
