[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-deepfake-detector"
version = "0.1.0"
description = "Trainable CPU-friendly research baseline for visual video manipulation detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "joblib>=1.3", "opencv-python-headless>=4.8,<5", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
video-deepfake = "video_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
