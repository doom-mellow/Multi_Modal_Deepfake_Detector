[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-integrity-detector"
version = "0.1.0"
description = "Trainable AI-text classifier and local-corpus plagiarism similarity search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
text-integrity = "text_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
