[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-deepfake-detector"
version = "0.1.0"
description = "Trainable audio spoofing detection research baseline using acoustic features"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "joblib>=1.3", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
audio-deepfake = "audio_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
